{{- /*
A PodDisruptionBudget is only meaningful once the controller runs with more than
one replica: on a single-replica Deployment a PDB cannot provide availability and
a minAvailable of 1 would instead block node drains entirely. We therefore render
it only when the operator is actually deployed in an HA (active/passive) topology.
*/ -}}
{{- if and .Values.podDisruptionBudget.enabled (gt (int .Values.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kamaji.fullname" . }}
  labels:
    {{- include "kamaji.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
spec:
  {{- if .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- else }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "kamaji.selectorLabels" . | nindent 6 }}
{{- end }}
